var HUNDREDS_ABBR = ["", "Ce", "Dn", "Tr", "Qadr", "Quinr", "Sedr", "Septr", "Octdr", "Nonr"];

function abbr(g) {
  if (g <= 10) return SHORT_ABBR[g];
  var n = g - 1;
  return ONES_ABBR[n % 10] + TENS_ABBR[Math.floor(n / 10) % 10] + HUNDREDS_ABBR[Math.floor(n / 100)];
}

function fmt(x) {
  if (x.lt("1e3003")) {
    var exp = Math.floor(x.log10().toNumber());
    if (exp < 6) {
      var n = x.toNumber();
      return n === Math.floor(n) ? String(Math.floor(n)) : n.toFixed(2);
    }
    var g = Math.floor(exp / 3);
    var m = x.div(new ExpantaNum(10).pow(new ExpantaNum(3 * g))).toNumber();
    return m.toFixed(2) + abbr(g);
  }
  var e = Math.floor(x.log10().toNumber());
  var m2 = x.div(new ExpantaNum(10).pow(e)).toNumber();
  return m2.toFixed(2) + "e" + e;
}

function caesar(s, k) {
  return s.replace(/[a-zA-Z]/g, function (c) {
    var base = c <= "Z" ? 65 : 97;
    return String.fromCharCode(((c.charCodeAt(0) - base + k % 26 + 26) % 26) + base);
  });
}

function b64ucs4(s) {
  var out = "";
  for (var i = 0; i < s.length;) {
    var cp = s.codePointAt(i);
    i += cp > 0xFFFF ? 2 : 1;
    out += String.fromCharCode((cp >>> 24) & 255, (cp >>> 16) & 255, (cp >>> 8) & 255, cp & 255);
  }
  return btoa(out);
}

function unb64ucs4(b) {
  var s = atob(b), out = "";
  for (var i = 0; i < s.length; i += 4) {
    var cp = ((s.charCodeAt(i) << 24) | (s.charCodeAt(i + 1) << 16) | (s.charCodeAt(i + 2) << 8) | s.charCodeAt(i + 3)) >>> 0;
    out += String.fromCodePoint(cp);
  }
  return out;
}

function charToNum(c) {
  if (c >= "a" && c <= "z") return c.charCodeAt(0) - 96;
  if (c >= "A" && c <= "Z") return c.charCodeAt(0) - 64 + 26;
  if (c >= "0" && c <= "9") return c.charCodeAt(0) - 48 + 52;
  if (c === "+") return 63;
  if (c === "/") return 64;
  return 65;
}

function numToChar(n) {
  if (n <= 26) return String.fromCharCode(n + 96);
  if (n <= 52) return String.fromCharCode(n - 26 + 64);
  if (n <= 62) return String.fromCharCode(n - 52 + 48);
  if (n === 63) return "+";
  if (n === 64) return "/";
  return "=";
}

function nToL(n) {
  n--;
  return String.fromCharCode(97 + Math.floor(n / 26)) + String.fromCharCode(97 + n % 26);
}

function lToN(p) {
  return (p.charCodeAt(0) - 97) * 26 + (p.charCodeAt(1) - 97) + 1;
}

function vigenere(s, dir) {
  var j = 0;
  return s.replace(/[a-z]/g, function (c) {
    var sh = dir * (VIG_KEY.charCodeAt(j % VIG_KEY.length) - 97);
    j++;
    return String.fromCharCode(((c.charCodeAt(0) - 97 + sh + 26) % 26) + 97);
  });
}

function decodeSave(enc) {

function quarkGain() {
  var l = voidAmt.log10();
  if (l.lt(308.25)) return new ExpantaNum(0);
  var g = l.sub(308.25).div(1000).pow(3).floor().add(1);
  if (quarkUpg[11]) g = g.mul(2);
  if (quarkUpg[12]) g = g.mul(10);
  if (quarkUpg[13]) g = g.mul(50);
  if (quarkUpg[20]) g = g.mul("1.79e12");
  if (quarkUpg[21]) g = g.mul("1e68");
  g = g.mul(new ExpantaNum(2).pow(lv[14]));
  g = g.mul(new ExpantaNum(3).pow(lv[15]));
  g = g.mul(new ExpantaNum(1.5).pow(lv[16]));
  g = g.mul(new ExpantaNum(2).pow(lv[17]));
  g = g.mul(new ExpantaNum(10).pow(lv[18]));
  if (quarkUpg[14]) g = g.pow(1.01);
  if (quarkUpg[15]) g = g.pow(1.1);
  if (quarkUpg[16]) g = g.pow(1.2);
  if (quarkUpg[17]) g = g.pow(1.5);
  if (quarkUpg[18]) g = g.pow(1.3);
  return g;
}

function doQuarkReset() {
  var g = quarkGain();
  if (g.lte(0)) return;
  quarks = quarks.add(g);
  if (quarks.gt(VOID_CAP)) quarks = new ExpantaNum(VOID_CAP);
  if (!quarkUpg[9]) {
    voidAmt = new ExpantaNum(0);
    for (var i = 0; i < lv.length; i++) lv[i] = 0;
    resetCount++;
  }
  if (!achs[21]) achs[21] = true;
}

  if (quarkUpg[7]) return 250;
  if (quarkUpg[6]) return 50;
  if (quarkUpg[5]) return 20;
  if (quarkUpg[4]) return 10;
  return 1;
}

function buyUpg(i) {
  var max = bulkAmount();
  var bought = 0;
  while (bought < max && lv[i - 1] < upgMax(i)) {
    var c = COSTS[i - 1](lv[i - 1]);
    if (!voidAmt.gte(c)) break;
    voidAmt = voidAmt.sub(c);
    lv[i - 1]++;
    bought++;
  }
}

  "Void gain ^1.3 + Quarks ^1.1 + Base achievement formula ^2",
  "Void gain ^1.4 + Quarks ^1.2 + Base achievement formula ^5",
  "Void gain ^1.5 + Quarks ^1.5 + Achievement boost x10 + formula ^10",
  "Void gain ^1.7 + Quarks ^1.3 + Achievement boost x10 + formula ^10",
  "Void gain ^1.7 + Quarks ^1.3 + Achievement boost x10 + formula ^10",
  "x1.79T Quarks",
  "x1e68 Quarks"
];

function loop(now) {
  var dt = new ExpantaNum((now - last) / 1000);
  last = now;

  var gain = new ExpantaNum(0.1).mul(new ExpantaNum(2).pow(lv[0])).mul(new ExpantaNum(1.1).pow(lv[1])).mul(new ExpantaNum(1.2).pow(lv[2])).mul(new ExpantaNum(1.5).pow(lv[3])).mul(new ExpantaNum(1.02).pow(lv[4])).mul(new ExpantaNum(3).pow(lv[5])).mul(new ExpantaNum(1.5).pow(lv[6])).mul(new ExpantaNum(1.05).pow(lv[7])).mul(new ExpantaNum(2).pow(lv[8])).mul(new ExpantaNum(2).pow(lv[9])).mul(new ExpantaNum(3).pow(lv[10])).mul(new ExpantaNum(10).pow(lv[11])).mul(new ExpantaNum(5).pow(lv[12])).mul(new ExpantaNum(2).pow(lv[13]));
  if (quarkUpg[0]) gain = gain.mul(10);
  if (quarkUpg[2]) gain = gain.mul(50);
  if (quarkUpg[4]) gain = gain.mul(100);
  gain = gain.mul(achMult());
  if (achs[17]) gain = gain.mul(3);
  if (quarkUpg[8]) gain = gain.pow(1.1);
  if (quarkUpg[10]) gain = gain.pow(1.05);
  if (quarkUpg[11]) gain = gain.pow(1.3);
  if (quarkUpg[12]) gain = gain.pow(1.1);
  if (quarkUpg[14]) gain = gain.pow(1.2);
  if (quarkUpg[15]) gain = gain.pow(1.3);
  if (quarkUpg[16]) gain = gain.pow(1.4);
  if (quarkUpg[17]) gain = gain.pow(1.5);
  if (quarkUpg[18]) gain = gain.pow(1.7);
  if (quarkUpg[19]) gain = gain.pow(1.7);
  if (lv[14] > 0) gain = gain.pow(new ExpantaNum(1.1).pow(lv[14]));
  if (lv[15] > 0) gain = gain.pow(new ExpantaNum(1.05).pow(lv[15]));
  if (lv[16] > 0) gain = gain.pow(new ExpantaNum(1.05).pow(lv[16]));
  if (lv[17] > 0) gain = gain.pow(new ExpantaNum(1.02).pow(lv[17]));
  if (lv[18] > 0) gain = gain.pow(new ExpantaNum(1.01).pow(lv[18]));

  voidAmt = voidAmt.add(gain.mul(dt));
  if (!quarkUpg[9] && voidAmt.gt(VOID_CAP)) voidAmt = new ExpantaNum(VOID_CAP);
  keptBase7 = Math.max(keptBase7, 0.05 * lv[6]);
  keptBase8 = Math.max(keptBase8, 0.005 * lv[7]);
  checkAchs();
  if (quarks.gt(VOID_CAP)) quarks = new ExpantaNum(VOID_CAP);
  if (!hardResetting) save();

  var am = achMult();
  document.getElementById("void").textContent = "Void: " + fmt(voidAmt) + (quarkUpg[9] ? "" : (voidAmt.gte(VOID_CAP) ? " (CAPPED)" : ""));
  document.getElementById("gain").textContent = "Gain: " + fmt(gain) + "/s";
  document.getElementById("mult").textContent =
    "Achievement multiplier: x" + fmt(am) + " (" + achs.filter(Boolean).length + "/" + achs.length + " achievements)";

  var html = "";
  for (var i = 1; i <= 19; i++) {
    var c = COSTS[i - 1](lv[i - 1]);
    var maxed = lv[i - 1] >= upgMax(i);
    document.getElementById("upg" + i).textContent =
      UPG_LABEL[i - 1] + " Void Upgrade: Level " + lv[i - 1] + "/" + upgMax(i) +
      ", Cost: " + (maxed ? "MAX" : fmt(c));
    document.getElementById("buy" + i).disabled = maxed || voidAmt.lt(c);
  }

  if (curTab === "achs") {
    var ahtml = "";
    for (var a = 0; a < achs.length; a++) {
      var label = ACH_NAMES[a] ? ACH_NAMES[a] + " (" + ACH_DESCS[a] + ")" : ACH_DESCS[a];
      ahtml += label + ": " + (achs[a] ? "Earned" : "Locked") + "<br>";
    }
    document.getElementById("alist").innerHTML = ahtml;
  }

  if (curTab === "quarks") {
    var qg = quarkGain();
    document.getElementById("qamt").textContent = "Quarks: " + fmt(quarks) + (quarks.gte(VOID_CAP) ? " (CAPPED)" : "");
    document.getElementById("qgaininfo").textContent = "Quarks on reset: " + fmt(qg);
    document.getElementById("qreset").disabled = qg.lte(0);
    for (var qi = 1; qi <= 22; qi++) {
      var btn = document.getElementById("qb" + qi);
      var owned = quarkUpg[qi - 1];
      var locked = (qi === 1 && quarkUpg[1]) || (qi === 2 && quarkUpg[0]);
      btn.textContent = QUARK_DESCS[qi - 1] + (owned ? " (Bought)" : locked ? " (Locked)" : " — Requires: " + fmt(new ExpantaNum(QUARK_COST[qi - 1])) + " Quarks");
      btn.disabled = owned || locked || quarks.lt(QUARK_COST[qi - 1]);
    }
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
<script src="../Void Admin Panel/admin.js"></script>
</body>
</html>
