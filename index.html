<script>
var SAVE_KEY = "voidSave";
var VIG_KEY = "void";
var voidAmt = new ExpantaNum(0);
var level = 0;
var level2 = 0;
var level3 = 0;
var level4 = 0;
var level5 = 0;
var level6 = 0;
var level7 = 0;
var level8 = 0;
var level9 = 0;
var level10 = 0;
var level11 = 0;
var level12 = 0;
var achs = [false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false];
var ACH_NAMES = ["Generational start", "Starting off strong", "Voidless mess", "A million of nothing", "Wow ur far now", "Nothing but void", "Boring but free boost is always good", "Ooo so good", "Finally out of the hard part", "10 billion of nothing", "Robert", "Topala", "Interesting", "Tobert Ropala", "10th anniversary for upgrades", "Veeery intersting", "I hear something", "Quarter of the letter", "Deka-void", ""];
var ACH_DESCS = ["Get 1 Void", "Buy Upgrade 3", "Get 1000 Void", "Get 1 million Void", "Buy Upgrade 5", "Reach 100M Void", "Max out Upgrade 5", "Max out Upgrade 3", "Buy 2 of Upgrade 6", "Get 10 billion Void", "Reach 1 quadrillion Void", "Reach 1 quintillion Void", "Buy Upgrade 8", "Buy Upgrade 9", "Buy Upgrade 10", "Reach 5 octillion Void", "Reach 100 octillion Void", "Buy 50 levels of Upgrade 8", "Reach 1 decillion Void", "Buy Upgrade 11"];
var UPG_MAX = [5, 20, 42, 10, 20, 10, 20, 200, 10, 20, 50, 100];
var ACH_BONUS = 0.25;
var last = performance.now();

function save() {
  localStorage.setItem(SAVE_KEY, JSON.stringify({ v: voidAmt.toString(), l: level, m: level2, n: level3, o: level4, p: level5, q: level6, r: level7, s: level8, t: level9, u: level10, w: level11, x: level12, a: achs }));
}

function load() {
  try {
    var d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!d) return;
    voidAmt = new ExpantaNum(d.v);
    level = d.l || 0;
    level2 = d.m || 0;
    level3 = d.n || 0;
    level4 = d.o || 0;
    level5 = d.p || 0;
    level6 = d.q || 0;
    level7 = d.r || 0;
    level8 = d.s || 0;
    level9 = d.t || 0;
    level10 = d.u || 0;
    level11 = d.w || 0;
    level12 = d.x || 0;
    if (d.a) for (var i = 0; i < achs.length; i++) achs[i] = !!d.a[i];
  } catch (e) {}
}

function checkAchs() {
  if (!achs[0] && voidAmt.gte(1)) achs[0] = true;
  if (!achs[1] && level3 > 0) achs[1] = true;
  if (!achs[2] && voidAmt.gte(1000)) achs[2] = true;
  if (!achs[3] && voidAmt.gte(1e6)) achs[3] = true;
  if (!achs[4] && level5 > 0) achs[4] = true;
  if (!achs[5] && voidAmt.gte(1e8)) achs[5] = true;
  if (!achs[6] && level5 >= 20) achs[6] = true;
  if (!achs[7] && level3 >= 42) achs[7] = true;
  if (!achs[8] && level6 >= 2) achs[8] = true;
  if (!achs[9] && voidAmt.gte(1e10)) achs[9] = true;
  if (!achs[10] && voidAmt.gte(1e15)) achs[10] = true;
  if (!achs[11] && voidAmt.gte(1e18)) achs[11] = true;
  if (!achs[12] && level8 > 0) achs[12] = true;
  if (!achs[13] && level9 > 0) achs[13] = true;
  if (!achs[14] && level10 > 0) achs[14] = true;
  if (!achs[15] && voidAmt.gte(5e27)) achs[15] = true;
  if (!achs[16] && voidAmt.gte(1e29)) achs[16] = true;
  if (!achs[17] && level8 >= 50) achs[17] = true;
  if (!achs[18] && voidAmt.gte(1e33)) achs[18] = true;
  if (!achs[19] && level11 > 0) achs[19] = true;
}

function upgMax(i) {
  return UPG_MAX[i - 1] + (achs[18] ? 10 : 0);
}

function achMult() {
  var count = 0;
  for (var i = 0; i < achs.length; i++) if (achs[i]) count++;
  var base = ACH_BONUS * (achs[17] ? 1.5 : 1);
  var r = base + (achs[9] ? 0.1 : 0) + 0.05 * level7 + 0.005 * level8;
  return new ExpantaNum(1 + r).pow(count);
}

var SHORT_ABBR = ["", "K", "M", "B", "T", "Qa", "Qt", "Sx", "Sp", "Oc", "No"];
var ONES_ABBR = ["", "U", "D", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No"];
var TENS_ABBR = ["", "Dc", "Vg", "Tg", "Qag", "Qig", "Sxg", "Spg", "Ocg", "Nog"];
var HUNDREDS_ABBR = ["", "Ce", "Dn", "Tr", "Qadr", "Quinr", "Sedr", "Septr", "Octdr", "Nonr"];

function abbr(g) {
  if (g <= 10) return SHORT_ABBR[g];
  var n = g - 1;
  return ONES_ABBR[n % 10] + TENS_ABBR[Math.floor(n / 10) % 10] + HUNDREDS_ABBR[Math.floor(n / 100)];
}

function fmt(x) {
  if (x.lt("1e3003")) {
    var exp = Math.floor(x.log10().toNumber());
    if (exp < 6) {
      var n = x.toNumber();
      return n === Math.floor(n) ? String(Math.floor(n)) : n.toFixed(2);
    }
    var g = Math.floor(exp / 3);
    var m = x.div(new ExpantaNum(10).pow(new ExpantaNum(3 * g))).toNumber();
    return m.toFixed(2) + abbr(g);
  }
  var e = Math.floor(x.log10().toNumber());
  var m2 = x.div(new ExpantaNum(10).pow(e)).toNumber();
  return m2.toFixed(2) + "e" + e;
}

function caesar(s, k) {
  return s.replace(/[a-zA-Z]/g, function (c) {
    var base = c <= "Z" ? 65 : 97;
    return String.fromCharCode(((c.charCodeAt(0) - base + k % 26 + 26) % 26) + base);
  });
}

function b64ucs4(s) {
  var out = "";
  for (var i = 0; i < s.length;) {
    var cp = s.codePointAt(i);
    i += cp > 0xFFFF ? 2 : 1;
    out += String.fromCharCode((cp >>> 24) & 255, (cp >>> 16) & 255, (cp >>> 8) & 255, cp & 255);
  }
  return btoa(out);
}

function unb64ucs4(b) {
  var s = atob(b), out = "";
  for (var i = 0; i < s.length; i += 4) {
    var cp = ((s.charCodeAt(i) << 24) | (s.charCodeAt(i + 1) << 16) | (s.charCodeAt(i + 2) << 8) | s.charCodeAt(i + 3)) >>> 0;
    out += String.fromCodePoint(cp);
  }
  return out;
}

function charToNum(c) {
  if (c >= "a" && c <= "z") return c.charCodeAt(0) - 96;
  if (c >= "A" && c <= "Z") return c.charCodeAt(0) - 64 + 26;
  if (c >= "0" && c <= "9") return c.charCodeAt(0) - 48 + 52;
  if (c === "+") return 63;
  if (c === "/") return 64;
  return 65;
}

function numToChar(n) {
  if (n <= 26) return String.fromCharCode(n + 96);
  if (n <= 52) return String.fromCharCode(n - 26 + 64);
  if (n <= 62) return String.fromCharCode(n - 52 + 48);
  if (n === 63) return "+";
  if (n === 64) return "/";
  return "=";
}

function nToL(n) {
  n--;
  return String.fromCharCode(97 + Math.floor(n / 26)) + String.fromCharCode(97 + n % 26);
}

function lToN(p) {
  return (p.charCodeAt(0) - 97) * 26 + (p.charCodeAt(1) - 97) + 1;
}

function vigenere(s, dir) {
  var j = 0;
  return s.replace(/[a-z]/g, function (c) {
    var sh = dir * (VIG_KEY.charCodeAt(j % VIG_KEY.length) - 97);
    j++;
    return String.fromCharCode(((c.charCodeAt(0) - 97 + sh + 26) % 26) + 97);
  });
}

function encodeSave(data) {
  var raw = JSON.stringify(data);
  var step1 = caesar(raw, 3);
  var step2 = b64ucs4(step1);
  var step3 = step2.split("").reverse().join("");
  var step4 = "";
  for (var i = 0; i < step3.length; i++) step4 += nToL(charToNum(step3[i]));
  var step5 = vigenere(step4, 1);
  return btoa(step5);
}

function decodeSave(enc) {
  var t1 = atob(enc.trim());
  var t2 = vigenere(t1, -1);
  var t3 = "";
  for (var i = 0; i < t2.length; i += 2) t3 += numToChar(lToN(t2.substr(i, 2)));
  var t4 = t3.split("").reverse().join("");
  var t5 = unb64ucs4(t4);
  var t6 = caesar(t5, -3);
  return JSON.parse(t6);
}

load();

function upg1Cost() {
  var over = Math.max(0, level - 5);
  return new ExpantaNum(1).mul(new ExpantaNum(1e10).pow(over));
}

document.getElementById("buy").onclick = function () {
  var cost = upg1Cost();
  if (level < upgMax(1) && voidAmt.gte(cost)) {
    voidAmt = voidAmt.sub(cost);
    level++;
  }
};

function upg2Cost() {
  return new ExpantaNum(40).mul(new ExpantaNum(1.15).pow(level2));
}

document.getElementById("buy2").onclick = function () {
  var cost = upg2Cost();
  if (level2 < upgMax(2) && voidAmt.gte(cost)) {
    voidAmt = voidAmt.sub(cost);
    level2++;
  }
};

function upg3Cost() {
  return new ExpantaNum(100).mul(new ExpantaNum(1.5).pow(level3));
}

document.getElementById("buy3").onclick = function () {
  var cost = upg3Cost();
  if (level3 < upgMax(3) && voidAmt.gte(cost)) {
    voidAmt = voidAmt.sub(cost);
    level3++;
  }
};

function upg4Cost() {
  return new ExpantaNum(1000).mul(new ExpantaNum(2).pow(level4));
}

document.getElementById("buy4").onclick = function () {
  var cost = upg4Cost();
  if (level4 < upgMax(4) && voidAmt.gte(cost)) {
    voidAmt = voidAmt.sub(cost);
    level4++;
  }
};

    level5++;
  }

    level6++;

}

document.getElementById("buy7").onclick = function () {
  var cost = upg7Cost();
  if (level7 < upgMax(7) && voidAmt.gte(cost)) {

    level7++;

  var cost = upg8Cost();

    level8++;
  }

}

document.getElementById("buy9").onclick = function () {
  var cost = upg9Cost();

document.getElementById("buy10").onclick = function () {

}

document.getElementById("buy12").onclick = function () {
  var cost = upg12Cost();
  if (level12 < upgMax(12) && voidAmt.gte(cost)) {
    voidAmt = voidAmt.sub(cost);
    level12++;
  }
};

document.getElementById("export").onclick = function () {
  prompt("Your save:", encodeSave({ v: voidAmt.toString(), l: level, m: level2, n: level3, o: level4, p: level5, q: level6, r: level7, s: level8, t: level9, u: level10, w: level11, x: level12, a: achs }));
};

document.getElementById("import").onclick = function () {
  var s = prompt("Paste your save:");
  if (!s) return;
  try {
    var d = decodeSave(s);
    voidAmt = new ExpantaNum(d.v);
    level = d.l || 0;
    level2 = d.m || 0;
    level3 = d.n || 0;
    level4 = d.o || 0;
    level5 = d.p || 0;
    level6 = d.q || 0;
    level7 = d.r || 0;
    level8 = d.s || 0;
    level9 = d.t || 0;
    level10 = d.u || 0;
    level11 = d.w || 0;
    level12 = d.x || 0;
    if (d.a) for (var i = 0; i < achs.length; i++) achs[i] = !!d.a[i];
    save();
  } catch (e) {
    alert("Invalid save");
  }
};

document.getElementById("atab").onclick = function () {
  var alist = document.getElementById("alist");
  var main = document.getElementById("main");
  var open = alist.style.display === "none";
  alist.style.display = open ? "" : "none";
  main.style.display = open ? "none" : "";
};

function loop(now) {
  var dt = new ExpantaNum((now - last) / 1000);
  last = now;
  var gain = new ExpantaNum(0.1).mul(new ExpantaNum(2).pow(level)).mul(new ExpantaNum(1.1).pow(level2)).mul(new ExpantaNum(1.2).pow(level3)).mul(new ExpantaNum(1.5).pow(level4)).mul(new ExpantaNum(1.02).pow(level5)).mul(new ExpantaNum(3).pow(level6)).mul(new ExpantaNum(1.5).pow(level7)).mul(new ExpantaNum(1.05).pow(level8)).mul(new ExpantaNum(2).pow(level9)).mul(new ExpantaNum(2).pow(level10)).mul(new ExpantaNum(3).pow(level11)).mul(new ExpantaNum(10).pow(level12)).mul(achMult()).mul(achs[17] ? 3 : 1);
  voidAmt = voidAmt.add(gain.mul(dt));
  checkAchs();
  save();

  var am = achMult();
  document.getElementById("void").textContent = "Void: " + fmt(voidAmt);
  document.getElementById("gain").textContent = "Gain: " + fmt(gain) + "/s";
  document.getElementById("mult").textContent = "Achievement multiplier: x" + fmt(am) + " (" + achs.filter(Boolean).length + "/" + achs.length + " achievements)";
  var btn = document.getElementById("buy");
  var c1 = upg1Cost();
  document.getElementById("upg").textContent =
    "x2 Void Upgrade: Level " + level + "/" + upgMax(1) + ", Cost: " + fmt(c1);
  btn.disabled = level >= upgMax(1) || voidAmt.lt(c1);

  var cost2 = upg2Cost();
  document.getElementById("upg2").textContent =
    "x1.1 Void Upgrade: Level " + level2 + "/" + upgMax(2) + ", Cost: " + fmt(cost2);
  document.getElementById("buy2").disabled = level2 >= upgMax(2) || voidAmt.lt(cost2);

  var cost3 = upg3Cost();
  document.getElementById("upg3").textContent =
    "x1.2 Void Upgrade: Level " + level3 + "/" + upgMax(3) + ", Cost: " + fmt(cost3);
  document.getElementById("buy3").disabled = level3 >= upgMax(3) || voidAmt.lt(cost3);

  var cost4 = upg4Cost();
  document.getElementById("upg4").textContent =
    "x1.5 Void Upgrade: Level " + level4 + "/" + upgMax(4) + ", Cost: " + fmt(cost4);
  document.getElementById("buy4").disabled = level4 >= upgMax(4) || voidAmt.lt(cost4);

  var cost5 = upg5Cost();
  document.getElementById("upg5").textContent =
    "x1.02 Void Upgrade: Level " + level5 + "/" + upgMax(5) + ", Cost: " + fmt(cost5);
  document.getElementById("buy5").disabled = level5 >= upgMax(5) || voidAmt.lt(cost5);

  var cost6 = upg6Cost();
  document.getElementById("upg6").textContent =
    "x3 Void Upgrade: Level " + level6 + "/" + upgMax(6) + ", Cost: " + fmt(cost6);
  document.getElementById("buy6").disabled = level6 >= upgMax(6) || voidAmt.lt(cost6);

  var cost7 = upg7Cost();
  document.getElementById("upg7").textContent =
    "x1.5 Void Upgrade: Level " + level7 + "/" + upgMax(7) + ", Cost: " + fmt(cost7);
  document.getElementById("buy7").disabled = level7 >= upgMax(7) || voidAmt.lt(cost7);

  var cost8 = upg8Cost();
  document.getElementById("upg8").textContent =
    "x1.05 Void Upgrade: Level " + level8 + "/" + upgMax(8) + ", Cost: " + fmt(cost8);
  document.getElementById("buy8").disabled = level8 >= upgMax(8) || voidAmt.lt(cost8);

  var cost9 = upg9Cost();
  document.getElementById("upg9").textContent =
    "x2 Void Upgrade: Level " + level9 + "/" + upgMax(9) + ", Cost: " + fmt(cost9);
  document.getElementById("buy9").disabled = level9 >= upgMax(9) || voidAmt.lt(cost9);

  var cost10 = upg10Cost();
  document.getElementById("upg10").textContent =
    "x2 Void Upgrade: Level " + level10 + "/" + upgMax(10) + ", Cost: " + fmt(cost10);
  document.getElementById("buy10").disabled = level10 >= upgMax(10) || voidAmt.lt(cost10);

  var cost11 = upg11Cost();
  document.getElementById("upg11").textContent =
    "x3 Void Upgrade: Level " + level11 + "/" + upgMax(11) + ", Cost: " + fmt(cost11);
  document.getElementById("buy11").disabled = level11 >= upgMax(11) || voidAmt.lt(cost11);

  var cost12 = upg12Cost();
  document.getElementById("upg12").textContent =
    "x10 Void Upgrade: Level " + level12 + "/" + upgMax(12) + ", Cost: " + fmt(cost12);
  document.getElementById("buy12").disabled = level12 >= upgMax(12) || voidAmt.lt(cost12);

  if (document.getElementById("alist").style.display !== "none") {
    var html = "";
    for (var i = 0; i < achs.length; i++) {
      var label = ACH_NAMES[i] ? ACH_NAMES[i] + " (" + ACH_DESCS[i] + ")" : ACH_DESCS[i];
      html += label + ": " + (achs[i] ? "Earned" : "Locked") + "<br>";
    }
    document.getElementById("alist").innerHTML = html;
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
